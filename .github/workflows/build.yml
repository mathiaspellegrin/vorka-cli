name: Build native Vorka for Windows

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Produce a customer-distributable, signed release"
        required: true
        type: boolean
        default: false
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "25.6.0"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run package:windows
      - name: Sign and verify Windows executable
        shell: pwsh
        env:
          VORKA_WINDOWS_CERTIFICATE_BASE64: ${{ secrets.VORKA_WINDOWS_CERTIFICATE_BASE64 }}
          VORKA_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.VORKA_WINDOWS_CERTIFICATE_PASSWORD }}
          VORKA_RELEASE_BUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:VORKA_WINDOWS_CERTIFICATE_BASE64)) {
            if ($env:VORKA_RELEASE_BUILD -eq "true") {
              throw "A customer release was requested but the Authenticode certificate is not configured."
            }
            Write-Warning "Development artifact only: Authenticode certificate is not configured."
            exit 0
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP "vorka-signing.pfx"
          try {
            [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:VORKA_WINDOWS_CERTIFICATE_BASE64))
            $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
              Sort-Object FullName -Descending |
              Select-Object -First 1
            if (-not $signTool) { throw "Windows SignTool was not found" }
            $executable = Get-Item "release\VORKA.exe"
            if (-not $executable) { throw "The Windows Vorka executable was not found" }
            & $signTool.FullName sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $certificatePath /p $env:VORKA_WINDOWS_CERTIFICATE_PASSWORD $executable.FullName
            if ($LASTEXITCODE -ne 0) { throw "Authenticode signing failed" }
            & $signTool.FullName verify /pa /all $executable.FullName
            if ($LASTEXITCODE -ne 0) { throw "Authenticode verification failed" }
          } finally {
            Remove-Item $certificatePath -Force -ErrorAction SilentlyContinue
          }
      - name: Generate release integrity manifest
        run: npm run manifest:release
      - uses: actions/upload-artifact@v4
        with:
          name: vorka-Windows-X64
          path: |
            release/VORKA.exe
            release/vorka-release-manifest.json
          if-no-files-found: error
