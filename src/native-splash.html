<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self'">
  <title>Vorka is starting</title>
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0}body{display:grid;place-items:center;background:#e7e2d6;color:#1e2b3c;font-family:"Segoe UI",sans-serif}.splash{display:flex;flex-direction:column;align-items:center;gap:14px}.logo{width:116px;height:116px;padding:14px;display:grid;place-items:center;background:#f8f6f0;border:1px solid rgba(30,43,60,.22);box-shadow:0 18px 45px rgba(30,43,60,.12)}img{display:block;width:88px;height:88px}.name{font-size:22px;font-weight:750;letter-spacing:.12em}.status{font:11px ui-monospace,monospace;letter-spacing:.08em;color:rgba(30,43,60,.72)}.bar{width:170px;height:5px;overflow:hidden;border:1px solid rgba(30,43,60,.3);background:rgba(255,255,255,.18)}.bar:after{content:"";display:block;width:45%;height:100%;background:#7a5423;animation:pulse 1.15s ease-in-out infinite}@keyframes pulse{0%{transform:translateX(-110%)}50%{transform:translateX(125%)}100%{transform:translateX(345%)}}
  </style>
</head>
<body><main class="splash" role="status"><div class="logo"><img src="vorka-mark.png" alt=""></div><div class="name">VORKA</div><div class="status">STARTING SECURE LOCAL APP…</div><div class="bar"></div></main></body>
</html>
